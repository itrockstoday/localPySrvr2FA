<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motorcycle Security Control Panel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 0.875rem;
      color: #94a3b8;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 10px;
      background-color: #f59e0b;
      color: #ffffff;
      transition: all 0.3s ease;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 1.25rem;
      text-align: center;
      letter-spacing: 0.25em;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #3b82f6;
    }

    .mode-select {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }

    .mode-btn {
      padding: 12px 6px;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: #334155;
      color: #cbd5e1;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      user-select: none;
    }

    .mode-btn:hover {
      background-color: #475569;
    }

    .mode-btn.disarm-full {
      grid-column: span 2;
      background-color: #dc2626;
      color: #ffffff;
      border-color: #ef4444;
      font-size: 0.88rem;
    }

    .mode-btn.active-disarm {
      background-color: #ef4444;
      color: #ffffff;
      border-color: #f87171;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
    }

    .mode-btn.active-owner {
      background-color: #10b981;
      color: #064e3b;
      border-color: #34d399;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
    }

    .mode-btn.active-borrower {
      background-color: #3b82f6;
      color: #1e3a8a;
      border-color: #60a5fa;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }

    .mode-btn.active-borrower-parked {
      background-color: #06b6d4;
      color: #164e63;
      border-color: #22d3ee;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
    }

    .mode-btn.active-parked {
      background-color: #f59e0b;
      color: #78350f;
      border-color: #fbbf24;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background-color: #22c55e;
      color: #052e16;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #16a34a;
    }

    .btn-submit:disabled {
      background-color: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }

    #message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.875rem;
      text-align: center;
      display: none;
    }

    #message.success {
      display: block;
      background-color: #064e3b;
      color: #a7f3d0;
      border: 1px solid #047857;
    }

    #message.error {
      display: block;
      background-color: #7f1d1d;
      color: #fecaca;
      border: 1px solid #b91c1c;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>🏍️ Motorcycle Security Panel</h1>
      <p>iPhone Control Center (iSH Host)</p>
      <div id="statusBadge" class="status-badge">CURRENT MODE: OWNER PARKED</div>
    </div>

    <form id="2faForm">
      <div class="form-group">
        <label for="pinInput">Enter 2FA Verification PIN</label>
        <input 
          type="password" 
          id="pinInput" 
          maxlength="6" 
          placeholder="••••••" 
          inputmode="numeric"
          pattern="[0-9]*"
          required 
          autocomplete="off"
        />
      </div>

      <label>Select System Operation Mode</label>
      <div class="mode-select">
        <div class="mode-btn disarm-full" id="btnDisarm" onclick="selectMode('DISARMED')">🔓 QUICK DISARM SYSTEM</div>
        <div class="mode-btn" id="btnOwner" onclick="selectMode('OWNER')">👑 OWNER</div>
        <div class="mode-btn" id="btnBorrower" onclick="selectMode('BORROWER')">🔑 BORROWER</div>
        <div class="mode-btn" id="btnBorrowerParked" onclick="selectMode('BORROWER_PARKED')">🅿️ BORROWER PARKED</div>
        <div class="mode-btn active-parked" id="btnParked" onclick="selectMode('PARKED')">🚨 OWNER PARKED</div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Submit PIN & Change Mode</button>
    </form>

    <div id="message"></div>
  </div>

  <script>
    let selectedMode = 'PARKED'; // Default Mode is OWNER PARKED
    const RENDER_ENDPOINT = 'https://hsp18msrender.onrender.com/verify-2fa';

    function selectMode(mode) {
      selectedMode = mode;
      const btnDisarm = document.getElementById('btnDisarm');
      const btnOwner = document.getElementById('btnOwner');
      const btnBorrower = document.getElementById('btnBorrower');
      const btnBorrowerParked = document.getElementById('btnBorrowerParked');
      const btnParked = document.getElementById('btnParked');

      btnDisarm.className = 'mode-btn disarm-full';
      btnOwner.className = 'mode-btn';
      btnBorrower.className = 'mode-btn';
      btnBorrowerParked.className = 'mode-btn';
      btnParked.className = 'mode-btn';

      if (mode === 'DISARMED') {
        btnDisarm.classList.add('active-disarm');
      } else if (mode === 'OWNER') {
        btnOwner.classList.add('active-owner');
      } else if (mode === 'BORROWER') {
        btnBorrower.classList.add('active-borrower');
      } else if (mode === 'BORROWER_PARKED') {
        btnBorrowerParked.classList.add('active-borrower-parked');
      } else if (mode === 'PARKED') {
        btnParked.classList.add('active-parked');
      }
    }

    document.getElementById('2faForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const pinInput = document.getElementById('pinInput');
      const submitBtn = document.getElementById('submitBtn');
      const messageBox = document.getElementById('message');
      const statusBadge = document.getElementById('statusBadge');

      const pinValue = pinInput.value.trim();

      if (!pinValue) {
        showMessage('Please enter a valid PIN code.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Transmitting...';
      messageBox.style.display = 'none';

      try {
        const response = await fetch(RENDER_ENDPOINT, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            pin: pinValue,
            mode: selectedMode
          })
        });

        if (!response.ok) {
          throw new Error(`Server returned HTTP ${response.status}`);
        }

        const data = await response.json();
        const displayMode = selectedMode === 'PARKED' ? 'OWNER PARKED' : selectedMode;
        
        showMessage(`✅ Verified! System set to ${displayMode}. GPS: ${data.gps || 'Logged'}`, 'success');
        statusBadge.textContent = `CURRENT MODE: ${displayMode}`;
        
        if (selectedMode === 'DISARMED') {
          statusBadge.style.backgroundColor = '#ef4444';
        } else if (selectedMode === 'OWNER') {
          statusBadge.style.backgroundColor = '#10b981';
        } else if (selectedMode === 'BORROWER') {
          statusBadge.style.backgroundColor = '#3b82f6';
        } else if (selectedMode === 'BORROWER_PARKED') {
          statusBadge.style.backgroundColor = '#06b6d4';
        } else {
          statusBadge.style.backgroundColor = '#f59e0b';
        }

        pinInput.value = '';
      } catch (err) {
        console.error('Submission Error:', err);
        showMessage('❌ Connection Error: Could not reach Render backend.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit PIN & Change Mode';
      }
    });

    function showMessage(msg, type) {
      const messageBox = document.getElementById('message');
      messageBox.textContent = msg;
      messageBox.className = type;
    }
  </script>
</body>
</html>
